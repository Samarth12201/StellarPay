name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]

jobs:
  smart-contract-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/payment_requests
            contracts/group_expense

      - name: Build Payment Requests Contract WASM
        working-directory: contracts/payment_requests
        run: cargo build --release --target wasm32-unknown-unknown --locked

      - name: Build Group Expense Contract WASM
        working-directory: contracts/group_expense
        run: cargo build --release --target wasm32-unknown-unknown --locked

      - name: Upload Soroban Contract Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-contract-wasm
          path: |
            contracts/payment_requests/target/wasm32-unknown-unknown/release/*.wasm
            contracts/group_expense/target/wasm32-unknown-unknown/release/*.wasm

      - name: Install Stellar CLI
        if: env.ENABLE_CONTRACT_DEPLOY == 'true'
        run: cargo install --locked stellar-cli
        env:
          ENABLE_CONTRACT_DEPLOY: ${{ secrets.ENABLE_CONTRACT_DEPLOY }}

      - name: Configure Stellar Testnet Deployer
        if: env.ENABLE_CONTRACT_DEPLOY == 'true'
        run: stellar keys add ci-deployer --secret-key "$STELLAR_SECRET_KEY"
        env:
          ENABLE_CONTRACT_DEPLOY: ${{ secrets.ENABLE_CONTRACT_DEPLOY }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}

      - name: Deploy Payment Requests Contract to Stellar Testnet
        if: env.ENABLE_CONTRACT_DEPLOY == 'true'
        working-directory: contracts/payment_requests
        run: stellar contract deploy --wasm target/wasm32-unknown-unknown/release/payment_requests.wasm --source ci-deployer --network testnet
        env:
          ENABLE_CONTRACT_DEPLOY: ${{ secrets.ENABLE_CONTRACT_DEPLOY }}

      - name: Deploy Group Expense Contract to Stellar Testnet
        if: env.ENABLE_CONTRACT_DEPLOY == 'true'
        working-directory: contracts/group_expense
        run: stellar contract deploy --wasm target/wasm32-unknown-unknown/release/group_expense.wasm --source ci-deployer --network testnet
        env:
          ENABLE_CONTRACT_DEPLOY: ${{ secrets.ENABLE_CONTRACT_DEPLOY }}

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: smart-contract-artifacts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Info
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
